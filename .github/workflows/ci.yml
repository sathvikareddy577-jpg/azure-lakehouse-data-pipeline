name: Verify lakehouse project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lakehouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q src scripts azure/databricks tests
      - name: Run unit tests with coverage
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: >-
          pytest -m "not integration" -q
          --cov=src --cov-report=term-missing --cov-report=xml
          --cov-fail-under=75

  delta-integration:
    name: Delta integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run Delta-backed tests
        env:
          RUN_DELTA_TESTS: "1"
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest -m integration -q

  infrastructure:
    name: Validate Azure artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate JSON templates
        run: find azure -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Check Terraform formatting
        run: terraform -chdir=azure/terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform -chdir=azure/terraform init -backend=false
      - name: Validate Terraform
        run: terraform -chdir=azure/terraform validate
